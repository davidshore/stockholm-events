name: Codington checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: codington-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, build and autograde
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Install Chromium for mobile grading
        run: npx playwright install --with-deps chromium

      - name: Automatic G checks — code and deployment
        id: grade_g_code
        continue-on-error: true
        run: npm run grade:g

      - name: Automatic G checks — mobile
        id: grade_g_mobile
        continue-on-error: true
        run: npm run grade:g:browser

      - name: Automatic VG checks
        id: grade_vg
        continue-on-error: true
        run: npm run grade:vg

      - name: Write grading summary
        if: always()
        run: |
          {
            echo "## Automatisk rättning"
            echo
            echo "| Nivå | Resultat |"
            echo "| --- | --- |"
            echo "| G: kod, API och deployment | ${{ steps.grade_g_code.outcome }} |"
            echo "| G: mobil | ${{ steps.grade_g_mobile.outcome }} |"
            echo "| VG: Server Component och Suspense | ${{ steps.grade_vg.outcome }} |"
            echo
            echo "Mätvärden och resonemang bedöms manuellt."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Require automatic G checks
        if: always()
        run: |
          if [[ "${{ steps.grade_g_code.outcome }}" != "success" ||
                "${{ steps.grade_g_mobile.outcome }}" != "success" ]]; then
            echo "En eller flera automatiska G-kontroller misslyckades."
            exit 1
          fi
